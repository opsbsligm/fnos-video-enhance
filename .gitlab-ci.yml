# GitLab CI for fnos-video-enhance（飞牛 fnOS「视频增强」应用）
#
# 执行器事实（2026-11-01 实证，勿凭猜测改动）：
#   macos      → 实例 runner id 8（本机 Mac M2，shell executor）。有 node 26 +
#                python3.11（目标运行包同为 3.11）+ esbuild（npm ci 可得）。
#   安全扫描    → 实例 runner id 14（受限 docker 执行器），安全模板镜像按 digest 固定。
#   实例未注入任何额外安全作业（实证：pipeline 980 的作业全集就是本文件声明的
#   8 个，无 .pipeline-policy-pre）。依赖漏洞扫描因此必须在本文件内自建，
#   见 依赖漏洞扫描；不能假设"实例会替我扫"。
#
# 为什么本地工具链作业必须挂在 macos runner：
#   Mac runner 以 Python 3.11 跑可移植回归（与目标解释器版本一致）；
#   Linux ACL/O_PATH/CUDA 与最终媒体验收仍须在 NAS 单独验证。
#
# 不启用 Docker 安全模板于 shell executor 之外的组合；发布产物（.fpk）需要在
# NAS 上用官方 fnpack 构建，属部署门禁，不在 CI 内伪造。

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - verify
  - test
  - security-gate

workflow:
  rules:
    # 有开启中的 MR 时，该分支的 push 流水线不建：判定合并的是 MR 流水线，
    # 两条并行只会让单并发扫描执行器排队。
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  # 与 NAS 生产运行包一致；升级运行包 Python 时同步改动此处与 src/version.py。
  PY: /opt/homebrew/bin/python3.11
  # 安全扫描在 MR 流水线上也要跑：判定合并的是 MR 流水线，扫描必须在它上面出结果。
  AST_ENABLE_MR_PIPELINES: "true"

# node 工具链作业共用：runner 由 launchd 启动，其 PATH 会命中
# /usr/local/bin/node（2021 年的 v14），而 /opt/homebrew 安装的 npm 需要
# node:path（node≥16），直接调用即 MODULE_NOT_FOUND（实证：pipeline 977 /
# job 6243）。esbuild 的 shebang 是 `#!/usr/bin/env node`，所以仅用 npm 的
# 绝对路径不够，必须把 /opt/homebrew/bin 前置到 PATH，让 npm 与 env 找到的
# 是同一个 node；作业内打印实际版本，避免"静默用了另一个 node"再次发生。
.node_toolchain:
  before_script:
    - export PATH="/opt/homebrew/bin:$PATH"
    - echo "node=$(command -v node) $(node -v)"; echo "npm=$(command -v npm) $(npm -v)"

# 安全扫描执行器 run_untagged=false，未打 tag 的作业会永久 pending；
# 因此默认落到扫描执行器，本地工具链作业各自显式 tags: [macos]。
default:
  tags:
    - 安全扫描

# ── verify ────────────────────────────────────────────────────────────────

版本一致性:
  stage: verify
  tags: [macos]
  script:
    - $PY scripts/ci/check_version_consistency.py
  rules: &always_on_mr_and_branch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

Python语法:
  stage: verify
  tags: [macos]
  script:
    - $PY -m compileall -q src scripts tests
  rules: *always_on_mr_and_branch

前端构建一致性:
  extends: .node_toolchain
  stage: verify
  tags: [macos]
  script:
    - npm ci --no-audit --no-fund
    - bash scripts/ci/check_build_freshness.sh
  rules: *always_on_mr_and_branch

# ── test ──────────────────────────────────────────────────────────────────

Python单测:
  stage: test
  tags: [macos]
  timeout: 10m
  script:
    - $PY -V
    - $PY -m unittest discover -s tests -v 2>&1 | tee python-tests.log
    - grep -q "^OK" python-tests.log
  artifacts:
    when: always
    expire_in: 1 week
    paths: [python-tests.log]
  rules: *always_on_mr_and_branch

前端单测:
  extends: .node_toolchain
  stage: test
  tags: [macos]
  timeout: 5m
  script:
    - npm ci --no-audit --no-fund
    - node --test tests/*.test.mjs
  rules: *always_on_mr_and_branch

打包清单自检:
  stage: test
  tags: [macos]
  timeout: 5m
  script:
    # test_package.py 校验打包阶段的文件取舍；不依赖 NAS，可在 CI 判定。
    - PYTHONPATH=src $PY -m unittest tests.test_package -v
  rules: *always_on_mr_and_branch

# ── 安全扫描（固定镜像 digest，防止上游 tag 漂移改变判定口径）──────────────

semgrep-sast:
  image: registry.gitlab.com/security-products/semgrep@sha256:6438917354ac62eebd1a85ba7dcd6d597f1bf4613ec6ea9eb61892cf4c3b4732
  allow_failure: false
  variables:
    # src/www/app.js 是 esbuild 产出的压缩 bundle（`npm run build` 重新生成，已入库
    # 以保证发布包可复现）。对它扫描有三个问题：行号落在单行压缩流上不可定位；
    # 判定口径由第三方 @trimjs/web-app 的内部实现决定（实证：pipeline 986 job 6317
    # 报出的 javascript-crypto-rule-node_insecure_random_generator 命中的是该 SDK
    # 内 crypto.randomUUID 不可用时的 Math.random 回退分支，本仓库自有代码的随机数
    # 一律来自 crypto.getRandomValues，见 src/auth-flow.mjs:13）；源码本身已由
    # src/frontend.js 上的同名规则覆盖。因此排除产物、保留源码，而不是整体放宽。
    SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS, src/www/app.js"

secret_detection:
  image: registry.gitlab.com/security-products/secrets@sha256:dd2449c8bf1fdb25c7e81b7128c9ada36e0b4f10c8763bd71c3a2ca8cda9e51a
  allow_failure: false

# 依赖漏洞扫描：官方 gemnasium 镜像在 registry.gitlab.com 已需认证拉取（本机匿名
# 探测 401）；本项目以已有 Node 工具链执行 npm audit，
# 并转成标准依赖扫描报告（原因写在脚本头部）。registry 显式指向 npmjs ——
# runner 默认的 npmmirror 未实现 audit 接口，直接 npm audit 会报错退出。
#
# 为什么不让 npm audit 的非零退出码直接判失败：那样报告工件不会产出，下游裁决作业
# 拿不到依据，也看不到是哪条依赖。这里保留退出码信息，把裁决统一交给
# 安全裁决门禁；转换脚本自身会拒绝不可用输入，所以"扫描没跑成"依然会失败。
# 报告由裁决作业实际消费，并按实例支持的官方 schema 离线校验。
依赖漏洞扫描:
  extends: .node_toolchain
  stage: test
  tags: [macos]
  timeout: 5m
  script:
    - npm ci --no-audit --no-fund
    - |
      set +e
      npm audit --json --registry=https://registry.npmjs.org > npm-audit.json
      echo "npm audit 退出码=$?（存在漏洞时为 1，判定交给 安全裁决门禁）"
      set -e
    - $PY scripts/ci/npm_audit_to_gitlab.py --input npm-audit.json --lock package-lock.json --scanner-version "$(npm --version)"
    - node scripts/ci/validate_dependency_report.cjs
  artifacts:
    when: always
    expire_in: 1 week
    # 两个文件都必须在 archive 里：下游 安全裁决门禁 通过 needs.artifacts:true 取到的是
    # archive（不是 reports 通道），只列 npm-audit.json 会让裁决作业拿不到标准报告，
    # 于是"依赖扫描报了漏洞"与"依赖扫描没跑"在门禁眼里长得一样。
    # 实证：pipeline 986 / job 6322 写出了 gl-dependency-scanning-report.json 并作为
    # dependency_scanning 报告上传成功，但 archive 里没有它。
    paths: [npm-audit.json, gl-dependency-scanning-report.json]
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  rules: *always_on_mr_and_branch

# ── 安全裁决门禁 ────────────────────────────────────────────────────────────
# GitLab 的 allow_failure 只约束分析器脚本退出码：pipeline 980 的 semgrep 报出
# 24 条（含 1 条 High）仍 success、漏洞看板 0 条。真正判定合并的是这个作业——
# 它读取上游报告，未处置的 High/Medium 直接失败，豁免必须逐条登记并由审查人认可。
安全裁决门禁:
  stage: security-gate
  tags: [macos]
  timeout: 5m
  needs:
    - job: semgrep-sast
      artifacts: true
    - job: secret_detection
      artifacts: true
    - job: 依赖漏洞扫描
      artifacts: true
  script:
    - $PY scripts/ci/assess_sast_findings.py --dir . --triage scripts/ci/sast-triage.json
  rules: *always_on_mr_and_branch
